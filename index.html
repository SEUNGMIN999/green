<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작전명: 2030 그린 플래닛 · 그린 401</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

  :root {
    --green: #2e7d32;
    --btn: #4caf50;
    --btn-dark: #2e7d32;
    --sky: #29b6f6;
    --sky-dark: #0277bd;
    --orange: #ff9800;
    --orange-dark: #e65100;
    --red: #f44336;
    --mint: #c8e6c9;
    --text: #2b3a2e;
    --blue-text: #2470a8;
    --bio: #43a047;
    --env: #29b6f6;
    --people: #ffb300;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', 'Pretendard', sans-serif;
    color: var(--text);
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #d4eeff 0%, #e8f5e9 70%);
    overflow: hidden;
  }
  button, .card, .hud, .modal { user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; border: none; cursor: pointer; white-space: nowrap; }
  button:focus, input:focus { outline: none; }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; }

  /* 눌리는 게임 버튼 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 28px; border-radius: 16px; font-size: 1.25rem; color: #fff;
    background: var(--btn); box-shadow: 0 5px 0 var(--btn-dark);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-dark); }
  .btn svg { width: 22px; height: 22px; }
  .btn.sky { background: var(--sky); box-shadow: 0 5px 0 var(--sky-dark); }
  .btn.sky:active { box-shadow: 0 1px 0 var(--sky-dark); }
  .btn.orange { background: var(--orange); box-shadow: 0 5px 0 var(--orange-dark); }
  .btn.orange:active { box-shadow: 0 1px 0 var(--orange-dark); }
  .btn.red { background: var(--red); box-shadow: 0 5px 0 #b71c1c; }
  .btn.ghost { background: #fff; color: var(--green); box-shadow: 0 5px 0 #a5d6a7; border: 2px solid #a5d6a7; }
  .btn.ghost:active { box-shadow: 0 1px 0 #a5d6a7; }
  .btn:disabled { background: #cfd8dc; box-shadow: 0 5px 0 #90a4ae; color: #fff; cursor: default; filter: none; transform: none; }

  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 12px; }

  /* 상단 HUD */
  .hud {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #fff; border-radius: 20px; padding: 8px 14px; min-height: 56px;
    box-shadow: 0 5px 0 rgba(46,125,50,0.15), 0 8px 18px rgba(0,0,0,0.06);
  }
  .stage-pill { display: flex; align-items: center; gap: 10px; white-space: nowrap; min-width: 0; }
  .stage-pill .logo { font-size: 1.2rem; color: var(--green); }
  .stage-pill .stage { font-size: 1rem; color: #fff; background: var(--green); padding: 4px 12px; border-radius: 999px; }
  .stage-pill .stage:empty { display: none; }
  .hud.playing .logo { display: none; }
  .hud-right { display: flex; align-items: center; gap: 8px; }
  .stats { display: flex; gap: 8px; }
  .stats.hidden, .lens-box.hidden { display: none; }
  .stat { display: flex; align-items: center; gap: 6px; background: #f4f8f4; padding: 6px 10px; border-radius: 14px; font-size: 0.98rem; white-space: nowrap; }
  .stat .ic { width: 22px; height: 22px; }
  .stat .bar-wrap { width: 60px; }
  .stat .num { width: 26px; text-align: right; font-size: 1.08rem; }
  .bar-wrap { height: 12px; background: #e3ebe4; border-radius: 6px; overflow: hidden; }
  .bar { height: 100%; border-radius: 6px; transition: width 0.9s cubic-bezier(.3,1.3,.5,1); }
  .lens-box { display: flex; align-items: center; gap: 6px; background: #e1f5fe; padding: 6px 10px; border-radius: 14px; white-space: nowrap; color: var(--sky-dark); font-size: 0.98rem; }
  .lens-icons { display: flex; gap: 2px; }
  .lens-icons svg { width: 22px; height: 22px; color: var(--sky); transition: transform 0.3s, opacity 0.3s; }
  .lens-icons svg.used { color: #b0bec5; opacity: 0.5; transform: scale(0.85); }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  .screen { flex: 1; min-height: 0; display: none; animation: fade 0.45s ease; }
  .screen.active { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .media { position: relative; overflow: hidden; background: #dcefe0; }
  .media img, .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #81a784; font-size: 1.1rem; text-align: center; padding: 12px; }

  /* 도입 */
  #intro { position: relative; }
  #intro .scene { position: absolute; inset: 0; border-radius: 24px; box-shadow: 0 8px 0 rgba(46,125,50,0.15); }
  .popup {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: min(640px, calc(100% - 32px)); background: #fff; border-radius: 24px;
    padding: 20px 26px; display: flex; flex-direction: column; gap: 12px; text-align: center;
    box-shadow: 0 6px 0 rgba(46,125,50,0.2), 0 14px 30px rgba(0,0,0,0.2);
  }
  .popup.pop-in { animation: popin 0.35s cubic-bezier(.3,1.4,.5,1); }
  @keyframes popin { from { opacity: 0; transform: translateX(-50%) scale(0.85); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  .speaker { align-self: center; font-size: 1rem; color: #fff; background: var(--green); padding: 4px 14px; border-radius: 999px; }
  .pop-text { font-size: 1.45rem; line-height: 1.55; color: var(--blue-text); min-height: 2.2em; }
  .pop-text.typing::after { content: '|'; color: var(--btn); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .popup .name-input { display: none; }
  .popup.ask-name .name-input { display: block; }
  .pop-foot { display: flex; justify-content: space-between; align-items: center; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: #e3ebe4; }
  .dots span.on { background: var(--btn); }
  .name-input { width: 100%; padding: 12px; font-size: 1.25rem; font-family: inherit; text-align: center; border: 3px solid var(--mint); border-radius: 14px; color: var(--green); }
  .name-input:focus { border-color: var(--btn); }

  /* 갈림길 */
  #stage { flex-direction: column; gap: 12px; }
  .banner { flex: none; align-self: center; text-align: center; background: #fff; border-radius: 18px; padding: 10px 26px; box-shadow: 0 5px 0 rgba(46,125,50,0.15); }
  .banner .q { font-size: 1.45rem; color: var(--green); }
  .arena { flex: 1; min-height: 0; display: flex; gap: 26px; position: relative; }
  .vs {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 3;
    width: 64px; height: 64px; border-radius: 50%; background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 1.45rem;
    border: 5px solid #fff; box-shadow: 0 5px 0 var(--orange-dark);
  }
  .card {
    flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; border-radius: 24px; padding: 10px;
    box-shadow: 0 7px 0 rgba(46,125,50,0.18), 0 12px 24px rgba(0,0,0,0.07);
    animation: cardin 0.5s cubic-bezier(.3,1.3,.5,1) both;
  }
  .card.b { animation-delay: 0.08s; }
  @keyframes cardin { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: none; } }
  .card-media { flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden; }
  .card-media > .media { position: absolute; inset: 0; }
  .side-badge {
    position: absolute; left: 10px; top: 10px; z-index: 2; width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 3px solid #fff;
  }
  .card.b .side-badge { background: #1e88e5; }
  /* 에코렌즈 미리보기 */
  .pip {
    position: absolute; right: 10px; bottom: 10px; z-index: 2; width: 54%; aspect-ratio: 16 / 10;
    border-radius: 12px; overflow: hidden; border: 4px solid var(--sky); background: #000;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3); display: none; transform-origin: bottom right;
  }
  .pip.show { display: block; animation: lensin 0.45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes lensin { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
  .pip .media { position: absolute; inset: 0; }
  .pip-label { position: absolute; left: 6px; top: 6px; z-index: 2; font-size: 0.8rem; color: #fff; background: var(--sky); padding: 2px 8px; border-radius: 999px; }
  .pip-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; font-size: 0.85rem; color: #fff; padding: 16px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); line-height: 1.35; }
  .card-info { flex: none; padding: 10px 6px 4px; display: flex; flex-direction: column; gap: 4px; }
  .who { font-size: 0.98rem; }
  .card.t-bio .who { color: #43a047; }
  .card.t-people .who { color: #ef8f00; }
  .voice { font-size: 1.1rem; line-height: 1.45; color: var(--blue-text); }
  .plan { font-size: 1.2rem; color: var(--green); }
  .card-actions { flex: none; display: flex; gap: 10px; padding: 8px 4px 6px; }
  .card-actions .btn { flex: 1; padding: 12px 10px; font-size: 1.15rem; }

  /* 결과 영상 */
  #result { position: relative; }
  #result .stage-media { position: absolute; inset: 0; border-radius: 24px; box-shadow: 0 8px 0 rgba(46,125,50,0.15); }
  .result-tag { position: absolute; left: 18px; top: 16px; z-index: 2; font-size: 1.05rem; color: #fff; background: rgba(0,0,0,0.45); padding: 6px 14px; border-radius: 999px; }
  .result-cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; border-radius: 0 0 24px 24px;
    padding: 60px 26px 22px; background: linear-gradient(transparent, rgba(0,0,0,0.6));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  }
  .result-cap h2 { font-size: 2rem; color: #fff; font-weight: normal; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  #btn-show { opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 0.4s, transform 0.4s; }
  #btn-show.ready { opacity: 1; pointer-events: auto; transform: none; animation: pulse 1.6s infinite 0.4s; }
  @keyframes pulse { 50% { filter: brightness(1.12); } }

  /* 팝업 */
  .layer { position: fixed; inset: 0; background: rgba(20,40,25,0.55); display: none; align-items: center; justify-content: center; z-index: 30; }
  .layer.show { display: flex; }
  .modal {
    width: min(520px, calc(100% - 32px)); background: #fff; border-radius: 26px; padding: 26px 28px 24px;
    display: flex; flex-direction: column; gap: 14px; text-align: center;
    box-shadow: 0 7px 0 rgba(46,125,50,0.25), 0 20px 40px rgba(0,0,0,0.25);
    animation: zoom 0.4s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes zoom { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .modal h3 { font-size: 1.7rem; font-weight: normal; color: var(--green); }
  .modal p { font-size: 1.15rem; line-height: 1.6; color: var(--blue-text); }
  .modal .row-btns { display: flex; gap: 12px; justify-content: center; margin-top: 4px; }
  .modal ol { list-style: none; display: flex; flex-direction: column; gap: 10px; text-align: left; align-self: center; }
  .modal ol li { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; }
  .modal ol li b { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--btn); color: #fff; font-weight: normal; display: flex; align-items: center; justify-content: center; }
  .modal ol li.lens b { background: var(--sky); }
  .legend { display: flex; gap: 8px; justify-content: center; }
  .legend > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #f4f8f4; border-radius: 14px; padding: 10px 6px; font-size: 0.92rem; color: #6b7d6e; }
  .legend .ic { width: 28px; height: 28px; }
  .legend b { font-weight: normal; font-size: 1.12rem; color: var(--text); }

  /* 지수 변화 */
  .changes { display: flex; flex-direction: column; gap: 12px; background: #f4f8f4; border-radius: 18px; padding: 16px 18px; }
  .crow { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; }
  .crow .ic { width: 28px; height: 28px; flex: none; }
  .crow .label { width: 56px; text-align: left; white-space: nowrap; }
  .crow .bar-wrap { flex: 1; height: 16px; border-radius: 8px; background: #fff; }
  .crow .bar { border-radius: 8px; }
  .crow .val { width: 34px; text-align: right; font-size: 1.2rem; }
  .delta { width: 54px; text-align: center; font-size: 1.05rem; padding: 3px 0; border-radius: 10px; color: #fff; opacity: 0; transform: scale(0.5); transition: opacity 0.3s, transform 0.35s cubic-bezier(.3,1.6,.5,1); }
  .delta.on { opacity: 1; transform: scale(1); }
  .delta.plus { background: var(--btn); }
  .delta.minus { background: var(--red); }
  .delta.zero { background: #b0bec5; }
  .warn { background: #ffebee; color: #c62828; border-radius: 14px; padding: 10px 14px; font-size: 1.1rem; animation: shake 0.5s 0.9s both; }
  .warn + .warn { margin-top: 8px; }
  @keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* 최종 보고 · 결말 */
  .rep-panel { flex: 1; min-width: 0; background: #fff; border-radius: 24px; padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 7px 0 rgba(46,125,50,0.15); overflow: auto; }
  .rep-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .rep-head h2 { font-size: 1.8rem; font-weight: normal; color: var(--green); }
  .rep-body { flex: 1; min-height: 0; display: flex; gap: 20px; }
  .rep-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .rep-right { flex: 1.2; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .rep-left .changes { gap: 22px; padding: 22px 22px; }
  .rep-left .crow { font-size: 1.3rem; }
  .rep-left .crow .ic { width: 34px; height: 34px; }
  .rep-left .crow .bar-wrap { height: 20px; border-radius: 10px; }
  .rep-left .crow .val { font-size: 1.45rem; width: 44px; }
  .eyebrow { font-size: 1.02rem; color: #81a784; }
  #ending { align-items: center; justify-content: center; }
  .end-card { width: min(760px, 100%); max-height: 100%; overflow: auto; background: #fff; border-radius: 28px; padding: 32px 36px; display: flex; flex-direction: column; gap: 16px; text-align: center; box-shadow: 0 8px 0 rgba(46,125,50,0.18), 0 16px 32px rgba(0,0,0,0.08); animation: zoom 0.5s cubic-bezier(.3,1.4,.5,1); }
  .end-grade { align-self: center; font-size: 1.1rem; color: #fff; background: var(--green); padding: 5px 16px; border-radius: 999px; }
  .end-card h1 { font-size: 2.6rem; font-weight: normal; color: var(--green); line-height: 1.25; }
  .end-btns { display: flex; gap: 12px; justify-content: center; }
  .decisions { display: flex; flex-direction: column; gap: 6px; }
  .decision { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: #f4f8f4; border-radius: 12px; font-size: 1.02rem; }
  .decision .yr { color: var(--btn); white-space: nowrap; }
  .decision .side { flex: none; padding: 2px 9px; border-radius: 999px; color: #fff; font-size: 0.85rem; white-space: nowrap; }
  .decision .side.people { background: var(--people); }
  .decision .side.bio { background: var(--bio); }
  .decision .what { flex: 1; }
  .decision .lensmark { flex: none; width: 20px; height: 20px; color: var(--sky); }
  .quote { font-size: 1.2rem; line-height: 1.65; padding: 16px 20px; background: #e8f5e9; border-radius: 16px; color: var(--green); }
  .think { padding: 14px 18px; background: #fff8e1; border-radius: 16px; font-size: 1.15rem; line-height: 1.55; color: var(--orange-dark); }

  #toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%) translateY(-12px); background: #37474f; color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 1.1rem; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 40; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 세로 화면 대비 */
  html { touch-action: manipulation; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 100; background: linear-gradient(180deg, #d4eeff, #e8f5e9); flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
  #rotate svg { width: 110px; height: 110px; color: var(--green); animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate b { font-weight: normal; font-size: 1.8rem; color: var(--green); }
  #rotate span { font-size: 1.15rem; color: var(--blue-text); }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

  @media (orientation: portrait), (max-height: 560px) {
    body { overflow: auto; }
    #app { height: auto; min-height: 100vh; }
    .hud { flex-wrap: wrap; }
    .hud-right { flex-wrap: wrap; }
    .arena { flex-direction: column; }
    .card-media { min-height: 220px; flex: none; }
    .vs { display: none; }
    .rep-body { flex-direction: column; }
    .rep-head { flex-wrap: wrap; }
    #intro, #result { min-height: 75vh; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="stage-pill"><span class="logo">작전명: 2030 그린 플래닛</span><span class="stage num" id="stage-label"></span></div>
    <div class="hud-right">
      <div class="stats hidden" id="stats"></div>
      <div class="lens-box hidden" id="lens-box">에코렌즈<div class="lens-icons" id="lens-icons"></div></div>
    </div>
  </header>

  <main>
    <!-- 도입 -->
    <section class="screen active" id="intro">
      <div class="media scene" id="intro-media"></div>
      <div class="popup" id="pop">
        <span class="speaker" id="pop-speaker"></span>
        <p class="pop-text" id="pop-text"></p>
        <input class="name-input" id="name-input" type="text" maxlength="12" placeholder="코드네임 입력" autocomplete="off">
        <div class="pop-foot">
          <div class="dots" id="pop-dots"></div>
          <button class="btn" id="pop-btn"></button>
        </div>
      </div>
    </section>

    <!-- 갈림길 -->
    <section class="screen" id="stage">
      <div class="banner"><div class="q" id="stage-q"></div></div>
      <div class="arena" id="arena"></div>
    </section>

    <!-- 결과 영상 -->
    <section class="screen" id="result">
      <div class="media stage-media" id="result-media"></div>
      <div class="result-tag" id="result-tag"></div>
      <div class="result-cap">
        <h2 id="result-title"></h2>
        <button class="btn orange" id="btn-show">결과 보기</button>
      </div>
    </section>

    <!-- 최종 보고 -->
    <section class="screen" id="report">
      <div class="rep-panel">
        <div class="rep-head">
          <div><div class="eyebrow">2030 임무 보고</div><h2 id="rep-name"></h2></div>
          <button class="btn orange" id="btn-ending">결과 보기</button>
        </div>
        <div class="rep-body">
          <div class="rep-left">
            <div class="eyebrow">최종 지수</div>
            <div class="changes" id="rep-stats"></div>
          </div>
          <div class="rep-right">
            <div class="eyebrow">갈림길 기록</div>
            <div class="decisions" id="rep-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 결말 -->
    <section class="screen" id="ending">
      <div class="end-card">
        <div class="end-grade" id="rep-grade"></div>
        <h1 id="rep-title"></h1>
        <p class="quote" id="rep-reply"></p>
        <div class="think" id="rep-think"></div>
        <div class="end-btns">
          <button class="btn ghost" id="btn-back">기록 다시 보기</button>
          <button class="btn red" id="btn-restart">처음부터</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="rotate">

/* ===== 미디어: 로컬 파일 → 대체 링크 → 안내 칸 ===== */
function resolve(src) { return /^https?:/.test(src) ? src : MEDIA_DIR + src; }
function fillMedia(box, { video = [], image = [], label = '' }) {
  const videos = video.map(resolve), images = image.map(resolve);
  const placeholder = () => { box.innerHTML = ''; const p = document.createElement('div'); p.className = 'placeholder'; p.textContent = label; box.appendChild(p); };
  const tryImage = (i) => {
    if (i >= images.length) return placeholder();
    const img = document.createElement('img'); img.alt = label;
    img.onerror = () => tryImage(i + 1); img.src = images[i];
    box.innerHTML = ''; box.appendChild(img);
  };
  const tryVideo = (i) => {
    if (i >= videos.length) return tryImage(0);
    const v = document.createElement('video');
    v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.onerror = () => tryVideo(i + 1); v.src = videos[i];
    box.innerHTML = ''; box.appendChild(v);
  };
  tryVideo(0);
}
function resultMedia(st, opt) {
  return { video: [`${st.year}-${opt.key}.mp4`, ...(opt.video || [])], image: [`${st.year}-${opt.key}.jpg`, ...opt.image], label: opt.resultTitle };
}

      <span class="num" id="hn-${s.key}"></span>
    </div>`).join('');
  $('lens-icons').innerHTML = Array.from({ length: LENS_MAX }, () => ICONS.lens).join('');
}
function updateHud() {

}

}
function renderIntro(newScene) {
  const sc = INTRO[intro.scene];
  if (newScene) fillMedia($('intro-media'), INTRO_MEDIA[sc.media]);
  const last = intro.line === sc.lines.length - 1;
  $('pop-speaker').textContent = sc.speaker;
  typeText(sc.lines[intro.line]);
  $('pop-btn').textContent = last ? sc.end : '다음';
  $('pop').classList.toggle('ask-name', !!(sc.name && last));
  $('pop-dots').innerHTML = sc.lines.map((_, i) => `<span class="${i === intro.line ? 'on' : ''}"></span>`).join('');
  const pop = $('pop'); pop.classList.remove('pop-in'); void pop.offsetWidth; pop.classList.add('pop-in');
  if (sc.name && last) setTimeout(() => $('name-input').focus(), 300);
}
$('pop-btn').onclick = () => {
  if (typeTimer) { finishTyping(); return; }
  const sc = INTRO[intro.scene];
  if (intro.line < sc.lines.length - 1) { intro.line++; renderIntro(false); return; }
  if (sc.name) { startGame(); return; }
  if (sc.fullscreen) goFullscreen();
  intro.scene++; intro.line = 0; renderIntro(true);
};
// 태블릿에서 전체 화면 (지원하는 브라우저만)
function goFullscreen() {
  const el = document.documentElement;
  try {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      const r = req.call(el);
      if (r && r.catch) r.catch(() => {});
    }
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
}
$('name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });

function startGame() {
  state.name = $('name-input').value.trim();
  $('name-input').blur();
  document.querySelector('.hud').classList.add('playing');
  $('stats').classList.remove('hidden');
  $('lens-box').classList.remove('hidden');
  updateHud();
  renderStage();
  openModal(`
    <h3>갈림길 안내</h3>
    <ol>
      <li><b>1</b>두 부탁 듣기</li>
      <li class="lens"><b>2</b>에코렌즈로 미래 미리 보기 (3번)</li>
      <li><b>3</b>한 길 선택</li>
    </ol>
    <div class="legend">
      <div><span class="ic" style="color:var(--bio)">${ICONS.bio}</span><b>생물</b>마을에 사는 생물</div>
      <div><span class="ic" style="color:var(--env)">${ICONS.env}</span><b>환경</b>물 · 공기 · 흙</div>
      <div><span class="ic" style="color:var(--people)">${ICONS.people}</span><b>주민</b>집 · 일자리 · 생활</div>
    </div>
    <div class="row-btns"><button class="btn" id="m-ok">확인</button></div>`,
    (m) => { m.querySelector('#m-ok').onclick = closeModal; });
}

/* ========================= 갈림길 ========================= */
function renderStage() {
  const st = STAGES[state.step];
  state.previewed = [false, false];
  state.busy = false;
  $('stage-label').textContent = `갈림길 ${state.step + 1}/${STAGES.length} · ${st.year} ${st.topic}`;
  $('stage-q').textContent = st.question;

  const arena = $('arena');
  arena.innerHTML = '<div class="vs">VS</div>';
  const order = Math.random() < 0.5 ? [0, 1] : [1, 0];
  order.forEach((idx, pos) => {
    const opt = st.options[idx];
    const side = pos === 0 ? 'A' : 'B';
    const card = document.createElement('div');
    card.className = 'card ' + (pos === 0 ? 'a' : 'b') + (idx === 0 ? ' t-people' : ' t-bio');
    card.dataset.idx = idx;
    card.dataset.side = side;
    card.innerHTML = `
      <div class="card-media">
        <div class="media main"></div>
        <div class="side-badge">${side}</div>
        <div class="pip"><div class="media"></div><span class="pip-label">에코렌즈</span><div class="pip-cap"></div></div>
      </div>
      <div class="card-info">
        <div class="who"></div>
        <div class="voice"></div>
        <div class="plan"></div>
      </div>
      <div class="card-actions">
        <button class="btn sky lens-btn">${ICONS.lens}에코렌즈</button>
        <button class="btn pick-btn">${side} 길 선택</button>
      </div>`;
    card.querySelector('.who').textContent = opt.who;
    card.querySelector('.voice').textContent = opt.voice;
    card.querySelector('.plan').textContent = opt.title;
    card.querySelector('.pip-cap').textContent = opt.preview;
    fillMedia(card.querySelector('.media.main'), { image: [`${st.year}-${opt.key}.jpg`, ...opt.image], label: opt.title });
    card.querySelector('.lens-btn').onclick = () => useLens(idx, card);
    card.querySelector('.pick-btn').onclick = () => confirmPick(idx);
    arena.appendChild(card);
  });
  refreshLensButtons();
  show('stage');
}

function refreshLensButtons() {
  document.querySelectorAll('#arena .card').forEach((card) => {
    const i = +card.dataset.idx;
    const b = card.querySelector('.lens-btn');
    if (state.previewed[i]) { b.disabled = true; b.innerHTML = `${ICONS.lens}미리보기 중`; }
    else { b.disabled = state.lens <= 0; if (state.lens <= 0) b.innerHTML = `${ICONS.lens}렌즈 소진`; }
  });
}

function useLens(idx, card) {
  if (state.previewed[idx] || state.lens <= 0) return;
  state.lens--;
  state.previewed[idx] = true;
  const st = STAGES[state.step];
  const pip = card.querySelector('.pip');
  fillMedia(pip.querySelector('.media'), resultMedia(st, st.options[idx]));
  pip.classList.add('show');
  updateHud();
  refreshLensButtons();
  toast(`에코렌즈 남은 횟수 ${state.lens}`);
}

function confirmPick(idx) {
  if (state.busy) return;
  const opt = STAGES[state.step].options[idx];
  const side = document.querySelector(`#arena .card[data-idx="${idx}"]`).dataset.side;
  openModal(`
    <h3>${side} 길 결정</h3>
    <p></p>
    <div class="row-btns"><button class="btn ghost" id="m-no">취소</button><button class="btn" id="m-yes">결정</button></div>`,
    (m) => {
      m.querySelector('p').textContent = opt.title;
      m.querySelector('#m-no').onclick = closeModal;
      m.querySelector('#m-yes').onclick = () => { closeModal(); pick(idx); };
    });
}

/* ========================= 결과 영상 ========================= */
let showTimer;
function pick(idx) {
  state.busy = true;
  const st = STAGES[state.step];
  const opt = st.options[idx];
  const before = { ...state.stats };
  Object.keys(opt.effect).forEach((k) => { state.stats[k] += opt.effect[k]; });
  const side = document.querySelector(`#arena .card[data-idx="${idx}"]`).dataset.side;
  state.picks.push({ year: st.year, type: idx === 0 ? 'people' : 'bio', title: opt.title, lens: state.previewed[idx], before, opt });

  fillMedia($('result-media'), resultMedia(st, opt));
  $('result-tag').textContent = `${st.year} ${st.topic} · ${side} 길`;
  $('result-title').textContent = opt.resultTitle;
  const btn = $('btn-show');
  btn.classList.remove('ready');
  clearTimeout(showTimer);
  showTimer = setTimeout(() => btn.classList.add('ready'), 2500);
  show('result');
}

$('btn-show').onclick = () => {
  const p = state.picks[state.picks.length - 1];
  const last = state.step === STAGES.length - 1;
  openModal(`
    <h3></h3>
    <p></p>
    <div class="changes" id="m-changes"></div>
    <div id="m-warn"></div>
    <div class="row-btns"><button class="btn orange" id="m-next">${last ? '최종 보고' : '다음 갈림길'}</button></div>`,
    (m) => {
      m.querySelector('h3').textContent = p.opt.resultTitle;
      m.querySelector('p').textContent = p.opt.resultText;
      buildChangeRows(m.querySelector('#m-changes'), p.before, state.stats, p.opt.effect);
      const warns = [];
      if (clamp(state.stats.people) <= WARN.people) warns.push('주민들이 하나둘 마을을 떠나고 있어요');
      if (ecoScore(state.stats) <= WARN.eco) warns.push('마을의 생물과 자연이 무너지고 있어요');
      m.querySelector('#m-warn').innerHTML = warns.map((w) => `<div class="warn">경고 · ${w}</div>`).join('');
      m.querySelector('#m-next').onclick = () => {
        closeModal();
        state.step++;
        if (state.step < STAGES.length) renderStage(); else renderReport();
      };
    });
  setTimeout(updateHud, 900);
};

function buildChangeRows(box, from, to, effect) {
  box.innerHTML = '';
  STATS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'crow';
    row.innerHTML = `
      <span class="ic" style="color:${s.color}">${ICONS[s.key]}</span>
      <span class="label">${s.label}</span>
      <div class="bar-wrap"><div class="bar" style="background:${s.color}"></div></div>
      <span class="val num"></span>
      ${effect ? '<span class="delta num"></span>' : ''}`;
    const a = clamp(from[s.key]), b = clamp(to[s.key]);
    const bar = row.querySelector('.bar'), val = row.querySelector('.val');
    bar.style.width = a + '%'; val.textContent = a;
    if (effect) {
      const d = row.querySelector('.delta'), e = effect[s.key] || 0;
      d.textContent = fmt(e);
      d.classList.add(e > 0 ? 'plus' : e < 0 ? 'minus' : 'zero');
      setTimeout(() => d.classList.add('on'), 450 + i * 180);
    }
    box.appendChild(row);
    setTimeout(() => { bar.style.width = b + '%'; countTo(val, a, b); }, 450 + i * 180);
  });
}
function countTo(el, a, b) {
  const t0 = performance.now(), dur = 800;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(a + (b - a) * k);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ========================= 최종 보고 ========================= */
function renderReport() {
  const eco = ecoScore(state.stats);
  const ending = ENDINGS.find((e) => e.test(eco, clamp(state.stats.people)));
  $('stage-label').textContent = '2030 임무 보고';
  $('rep-name').textContent = `그린 401 ${agentName()}의 선택`;
  buildChangeRows($('rep-stats'), START, state.stats, null);
  const list = $('rep-list');
  list.innerHTML = '';
  state.picks.forEach((p) => {
    const d = document.createElement('div');
    d.className = 'decision';
    d.innerHTML = `<span class="yr num"></span><span class="side ${p.type}">${p.type === 'bio' ? '생물' : '사람'}</span><span class="what"></span>${p.lens ? `<span class="lensmark">${ICONS.lens}</span>` : ''}`;
    d.querySelector('.yr').textContent = p.year;
    d.querySelector('.what').textContent = p.title;
    list.appendChild(d);
  });
  $('rep-grade').textContent = ending.grade;
  $('rep-title').textContent = ending.title;
  $('rep-reply').textContent = ending.reply.replace(/{agent}/g, agentName());
  $('rep-think').textContent = THINK;
  show('report');
}
$('btn-restart').onclick = () => location.reload();
$('btn-ending').onclick = () => { $('stage-label').textContent = '2050년에서 온 답장'; show('ending'); };
$('btn-back').onclick = () => { $('stage-label').textContent = '2030 임무 보고'; show('report'); };

buildHud();
renderIntro(true);
</script>
</body>
</html>
