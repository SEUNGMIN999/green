      ]
    }
  ];

  // 결말 4종 (위에서부터 먼저 맞는 것)
  const ENDINGS = [
    { test: (s) => s.pollution >= 60, title: "회색빛 미래",
      text: "무분별한 개발로 그린 플래닛은 공기도 물도 뿌연 회색 도시가 되었습니다.<br>2050년에서 온 메시지는 바뀌지 않았습니다...",
      media: "ending-gray.mp4" },
    { test: (s) => s.nature >= 90, title: "환경 중심의 미래",
      text: "{name}의 선택으로 그린 플래닛은 자연과 공존하는 깨끗한 곳이 되었습니다.<br>다만 살림은 넉넉하지 않아 앞으로의 과제도 남았습니다.",
      media: "ending-nature.mp4" },
    { test: (s) => s.economy >= 1500, title: "경제 중심의 미래",
      text: "{name}의 선택으로 그린 플래닛은 눈부신 경제 성장을 이뤘지만,<br>숲과 강은 많이 줄어들었습니다. 미래는 화려하지만 위태로워 보입니다.",
      media: "ending-economy.mp4" },
    { test: () => true, title: "균형 발전의 미래",
      text: "{name}은 환경과 경제 사이에서 균형을 잡으려 노력했습니다.<br>그린 플래닛은 가능성과 과제를 함께 안은 곳이 되었습니다.",
      media: "ending-balance.mp4" },
  ];

  /* ========================= 공통 ========================= */
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const agent = () => escapeHtml(gameState.agentName ? `${gameState.agentName} 대원` : '그린 401 대원');
  const withName = (s) => s.replace(/{name}/g, agent());

  function clampState() {
    gameState.economy = Math.max(0, gameState.economy);
    gameState.nature = Math.max(0, Math.min(150, gameState.nature));
    gameState.pollution = Math.max(0, gameState.pollution);
  }

  // 에코렌즈 안경 아이콘
  const GLASS = (cls = '') => `<svg class="glass ${cls}" viewBox="0 0 34 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="4"/><rect x="20" y="3" width="12" height="10" rx="4"/><path d="M14 7q3-2.5 6 0"/></svg>`;
  const pct = (v, max) => Math.max(0, Math.min(100, v / max * 100)) + '%';

  function updateUI() {
    $('year-stat').textContent = gameState.year + '년';
    $('economy').textContent = gameState.economy;
    $('nature').textContent = gameState.nature;
    $('pollution').textContent = gameState.pollution;
    $('bar-economy').style.width = pct(gameState.economy, 2500);
    $('bar-nature').style.width = pct(gameState.nature, 120);
    $('bar-pollution').style.width = pct(gameState.pollution, 100);
    $('lens-icons').innerHTML = [0, 1, 2].map((i) => GLASS(i < gameState.ecoLensUses ? '' : 'used')).join('');
  }

  // 영상: MEDIA_BASE 폴더의 파일 → 없으면 FALLBACK 주소
  function makeVideo(name) {
    const sources = [MEDIA_BASE + name, FALLBACK[name]].filter(Boolean);
    const v = document.createElement('video');
    v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    let i = 0;
    v.onerror = () => { i++; if (i < sources.length) v.src = sources[i]; };
    v.src = sources[0];
    return v;
  }

  function updateMedia(name) {
    const mc = $('media-container');
    mc.style.opacity = 0;
    setTimeout(() => {
      mc.innerHTML = '';
      if (name) mc.appendChild(makeVideo(name));
      mc.style.opacity = 1;
    }, 300);
  }

  function setScene(title, desc, media) {
    $('scenario-title').textContent = title;
    $('scenario-description').innerHTML = desc;
    updateMedia(media);
  }

  function setButtons(list) {
    const c = $('choices');
    c.className = '';
    c.innerHTML = '';
    list.forEach((b) => {
      const btn = document.createElement('button');
      btn.textContent = b.text;
      if (b.className) btn.className = b.className;
      if (b.disabled) btn.disabled = true;
      btn.onclick = b.onclick;
      c.appendChild(btn);
    });
  }

  function showModal(title, html, buttons, contentClass = '') {
    const mc = $('modal-content');
    mc.className = contentClass;
    $('modal-title').innerHTML = title;
    $('modal-text').innerHTML = html;
    const mb = $('modal-buttons');
    mb.className = contentClass === 'confirm-content' ? 'row' : '';
    mb.innerHTML = '';
    buttons.forEach((b) => {
      const btn = document.createElement('button');
      btn.textContent = b.text;
      if (b.className) btn.className = b.className;
      btn.onclick = b.onclick;
      mb.appendChild(btn);
    });
    $('modal').style.display = 'flex';
  }
  function hideModal() { $('modal').style.display = 'none'; $('modal-content').onclick = null; }

  // 타자 효과 — 화면을 누르면 문장이 바로 끝까지 나옴
  function typeWriter(title, text, nextStep) {
    showModal(title, '', [], 'hologram-content');
    const el = $('modal-text');
    const mc = $('modal-content');
    let i = 0, done = false, timer = null;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      el.innerHTML = text;
      const btn = document.createElement('button');
      btn.textContent = nextStep.buttonText;
      btn.className = 'action-button-red';
      btn.onclick = (e) => { e.stopPropagation(); hideModal(); nextStep.action(); };
      $('modal-buttons').appendChild(btn);
    };
    const type = () => {
      if (i >= text.length) return finish();
      if (text.startsWith('<br>', i)) { el.innerHTML += '<br>'; i += 4; }
      else { el.innerHTML += text.charAt(i); i++; }
      timer = setTimeout(type, TYPE_SPEED);
    };
    mc.onclick = () => { if (!done) finish(); };
    type();
  }

  /* ========================= 도입 ========================= */
  function startScene() {

    $('stats-bar').style.display = 'none';

      + "선택지 옆 '에코렌즈' 버튼을 누르면 그 선택의 결과를 미리 볼 수 있습니다.<br>"
      + "단, <b>모두 3번</b>만 쓸 수 있으니 신중하게 사용해 주세요.",

  function startFirstYear() {
    $('stats-bar').style.display = 'flex';
    updateUI();
    showYearTransition(gameState.year);

  /* ========================= 상황 ========================= */
  function showYearTransition(year) {
    showModal('', `<span class="year-popup-text num">${year}년</span>`, [], 'year-content');
    setTimeout(() => { hideModal(); renderScenario(); }, 2500);
  }

  function renderScenario() {
    const sc = scenarios[gameState.year - START_YEAR];
    yearStart = { economy: gameState.economy, nature: gameState.nature, pollution: gameState.pollution };
    setScene(withName(sc.title), withName(sc.description), sc.image);
    const c = $('choices');
    c.className = 'cards';
    c.innerHTML = '';
    sc.choices.forEach((ch, idx) => {
      const L = 'AB'[idx];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="tag">${L} 선택지</div><div class="opt">${ch.text}</div>
        <div class="row"><button class="btn btn-lens"></button><button class="btn pick">${L} 선택</button></div>`;
      const lensBtn = card.querySelector('.btn-lens');
      card.lensBtn = lensBtn;
      setLensBtn(card, 'ready');
      lensBtn.onclick = () => useEcoLens(card, ch);
      card.querySelector('.pick').onclick = () => confirmChoice(ch, L);
      c.appendChild(card);
    });
  }

  // 에코렌즈 버튼 상태: ready(사용 가능) / viewing(미리보기 중) / seen(다시 보기, 무료) / none(남은 렌즈 없음)
  function setLensBtn(card, state) {
    const b = card.lensBtn;
    if (state === 'ready' && gameState.ecoLensUses <= 0) state = 'none';
    card.lensState = state;
    const label = { ready: '에코렌즈', viewing: '미리보기 중', seen: '다시 보기', none: '에코렌즈 없음' }[state];
    b.innerHTML = GLASS() + label;
    b.disabled = state === 'viewing' || state === 'none';
  }

  // 에코렌즈: 그 선택의 결과 영상을 작게 미리 보여 줌 (숫자는 감춤)
  function useEcoLens(card, ch) {
    if (card.lensState === 'ready') {
      if (gameState.ecoLensUses <= 0) return;
      gameState.ecoLensUses--;
      updateUI();
      document.querySelectorAll('#choices .card').forEach((k) => { if (k !== card && k.lensState === 'ready') setLensBtn(k, 'ready'); });
    } else if (card.lensState !== 'seen') return;
    const pv = document.createElement('div');
    pv.className = 'preview';
    pv.appendChild(makeVideo(ch.resultVideo));
    pv.insertAdjacentHTML('beforeend', `<span class="badge">에코렌즈</span><button class="close">닫기</button><div class="cap">${ch.resultText.replace(/<br>/g, ' ')}</div>`);
    pv.querySelector('.close').onclick = () => { pv.remove(); setLensBtn(card, 'seen'); };
    card.appendChild(pv);
    setLensBtn(card, 'viewing');
  }

  function confirmChoice(ch, L) {
    showModal(`${L} 결정`, `<p class="confirm-text">${ch.text}</p>`, [
      { text: '취소', className: 'btn-ghost', onclick: hideModal },
      { text: '결정', onclick: () => { hideModal(); handleChoice(ch); } },
    ], 'confirm-content');
  }

  function handleChoice(choice) {
    const e = choice.effects;
    gameState.economy += e.economy || 0;
    gameState.nature += e.nature || 0;
    gameState.pollution += e.pollution || 0;
    clampState();
    updateUI();
    showResult(choice);
  }

  function showResult(choice) {
    setScene(choice.resultTitle, choice.resultText, choice.resultVideo);
    const last = gameState.year === START_YEAR + scenarios.length - 1;
    setButtons([{ text: `${gameState.year}년 결산`, className: 'next-year', onclick: () => showYearlySummary(last) }]);
  }

  function summaryRow(label, now, before, bad) {
    const d = now - before;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'zero';
    return `<div class="summary-row"><span class="label">${label}</span><span class="val num">${now}</span><span class="delta num ${bad ? 'bad ' : ''}${cls}">${fmt(d)}</span></div>`;
  }

  function showYearlySummary(last) {
    const s = gameState, b = yearStart;
    const html = `<div class="summary">
      ${summaryRow('경제', s.economy, b.economy, false)}
      ${summaryRow('자연', s.nature, b.nature, false)}
      ${summaryRow('오염', s.pollution, b.pollution, true)}
    </div>`;
    showModal(`${s.year}년 결산`, html, [{
      text: last ? '최종 결과 확인' : '다음 해로',
      className: last ? 'action-button-red' : 'next-year-button',
      onclick: () => { hideModal(); last ? showEndGame() : proceedToNextYear(); },
    }]);
  }

  function proceedToNextYear() {
    gameState.economy += 200;                                // 해마다 기본 수입
    gameState.pollution = Math.max(0, gameState.pollution - 2); // 자연 정화
    gameState.year++;
    clampState();
    updateUI();
    showYearTransition(gameState.year);
  }

  /* ========================= 결말 ========================= */
  function showEndGame() {
    const s = gameState;
    const end = ENDINGS.find((e) => e.test(s));
    $('stats-bar').style.display = 'none';
    setScene(end.title,
      withName(end.text) + `<br><span class="final-stats"><span class="num">자연 ${s.nature}</span><span class="num">오염 ${s.pollution}</span><span class="num">경제 ${s.economy}</span></span>`,
      end.media);
    setButtons([
      { text: '게임 후기 남기기', className: 'action-button-red', onclick: () => window.open(MENTI_URL, '_blank') },
      { text: '처음부터 다시하기', className: 'sub-button', onclick: startScene },
    ]);
  }

  /* ========================= 시작 ========================= */
  // QR(?qr=green401)로 들어오면 메시지 활성화부터, 아니면 교실 장면부터
  window.onload = () => {
    startScene();
    try {
      if (window.google && google.script && google.script.url) {
        google.script.url.getLocation((loc) => {
          if (loc && loc.parameter && loc.parameter.qr === QR_CODE) qrRecognized();
        });
      } else if (new URLSearchParams(location.search).get('qr') === QR_CODE) {
        qrRecognized();
      }
    } catch (e) {}
  };
</script>

</body>
